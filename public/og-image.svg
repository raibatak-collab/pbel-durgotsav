<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Segoe UI', -apple-system, system-ui, Roboto, sans-serif">
  <defs>
    <!-- Royal Festive Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0711" />
      <stop offset="35%" stop-color="#6B0D1D" />
      <stop offset="70%" stop-color="#881327" />
      <stop offset="100%" stop-color="#3B0711" />
    </linearGradient>

    <!-- Radiant Divine Gold -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="30%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="240" cy="315" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#B45309" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3B0711" stop-opacity="0" />
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Sun Aura Behind Logo -->
  <circle cx="250" cy="315" r="280" fill="url(#sunGlow)" />

  <!-- Outer Ornate Gold Border -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <rect x="28" y="28" width="1144" height="574" rx="14" fill="none" stroke="#FCD34D" stroke-width="1" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Corner Mandalas -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2">
    <path d="M 32,64 A 32,32 0 0,0 64,32" />
    <circle cx="48" cy="48" r="4" fill="#FCD34D" />
    <path d="M 1168,64 A 32,32 0 0,1 1136,32" />
    <circle cx="1152" cy="48" r="4" fill="#FCD34D" />
    <path d="M 32,566 A 32,32 0 0,1 64,598" />
    <circle cx="48" cy="582" r="4" fill="#FCD34D" />
    <path d="M 1168,566 A 32,32 0 0,0 1136,598" />
    <circle cx="1152" cy="582" r="4" fill="#FCD34D" />
  </g>

  <!-- Left Side: Durga Trishul & Trinetra Sacred Emblem -->
  <g transform="translate(60, 105)" filter="url(#dropShadow)">
    <g transform="scale(0.82)">
      ﻿
  <defs>
    <!-- Royal Crimson Festive Gradient Background -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#A5132B"/>
      <stop offset="60%" stop-color="#700B1A"/>
      <stop offset="100%" stop-color="#3D030C"/>
    </radialGradient>

    <!-- Radiant Divine Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Glowing Aura -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#850E1F" stop-opacity="0"/>
    </radialGradient>

    <!-- Sacred Red Sindoor -->
    <radialGradient id="sindoorRed" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF1E38"/>
      <stop offset="100%" stop-color="#B80018"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="18"/>
  
  <!-- Subtle Inner Gold Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FDE68A" stroke-width="3" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Divine Aura behind Trishul -->
  <circle cx="256" cy="240" r="160" fill="url(#auraGlow)"/>

  <!-- SACRED DURGA TRISHUL (TRIDENT) & THIRD EYE -->
  <g transform="translate(0, 5)">
    <!-- Trishul Shaft / Central Staff -->
    <path d="M 248 200 L 264 200 L 260 430 L 252 430 Z" fill="url(#goldGrad)"/>
    <path d="M 244 425 L 268 425 L 256 450 Z" fill="url(#goldGrad)"/>

    <!-- Trishul Base Ring / Damru accent -->
    <ellipse cx="256" cy="205" rx="18" ry="8" fill="url(#goldGrad)"/>
    <ellipse cx="256" cy="330" rx="14" ry="6" fill="url(#goldGrad)"/>

    <!-- Center Spear Blade (Sharp Royal Trishul Spike) -->
    <path d="M 256 70 Q 275 140 262 210 L 250 210 Q 237 140 256 70 Z" fill="url(#goldGrad)" stroke="#FFF5B8" stroke-width="2"/>

    <!-- Left Trishul Curved Prong -->
    <path d="M 250 195 C 190 200 135 150 148 100 C 158 135 200 170 248 178 Z" fill="url(#goldGrad)" stroke="#FFF5B8" stroke-width="2"/>
    <circle cx="148" cy="100" r="8" fill="#FFF5B8"/>

    <!-- Right Trishul Curved Prong -->
    <path d="M 262 195 C 322 200 377 150 364 100 C 354 135 312 170 264 178 Z" fill="url(#goldGrad)" stroke="#FFF5B8" stroke-width="2"/>
    <circle cx="364" cy="100" r="8" fill="#FFF5B8"/>

    <!-- Sacred Trinetra (Devi Durga Divine Third Eye) -->
    <g transform="translate(256, 275)">
      <!-- Eye Almond Contour -->
      <path d="M -42 0 Q 0 -26 42 0 Q 0 26 -42 0 Z" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="3.5"/>
      <!-- Iris / Pupil -->
      <circle cx="0" cy="0" r="14" fill="#2E050B"/>
      <circle cx="0" cy="0" r="8" fill="url(#sindoorRed)"/>
      <circle cx="3" cy="-3" r="3.5" fill="#FFFFFF"/>

      <!-- Sacred Chandrabindu / Top Tilak -->
      <path d="M -16 -34 Q 0 -48 16 -34 Q 0 -40 -16 -34 Z" fill="url(#goldGrad)"/>
      <circle cx="0" cy="-44" r="5" fill="url(#sindoorRed)"/>
    </g>

    <!-- Auspicious Lotus Petal Accents at Base -->
    <path d="M 256 360 C 220 370 210 395 230 405 C 248 395 254 375 256 360 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M 256 360 C 292 370 302 395 282 405 C 264 395 258 375 256 360 Z" fill="url(#goldGrad)" opacity="0.9"/>
  </g>


    </g>
  </g>

  <!-- Right Side: Festival Typography & Content -->
  <g transform="translate(510, 80)">
    <!-- Sacred Invocation -->
    <text x="0" y="45" fill="#FDE68A" font-size="20" font-weight="700" letter-spacing="3">॥ জয় মা দুর্গা ॥ • শুভ শারদোৎসব</text>

    <!-- Main Title -->
    <text x="0" y="115" fill="url(#goldGrad)" font-size="52" font-weight="900" letter-spacing="1.5" filter="url(#glow)">PBEL CITY DURGOTSAV</text>
    <text x="0" y="165" fill="#FFFFFF" font-size="28" font-weight="700" letter-spacing="3">2026 • 15 TO 20 OCTOBER</text>

    <!-- Organizer Pill -->
    <g transform="translate(0, 190)">
      <rect width="400" height="34" rx="17" fill="#000000" fill-opacity="0.35" stroke="url(#goldGrad)" stroke-width="1.2" />
      <text x="200" y="22" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700" letter-spacing="1.5">ORGANIZED BY PBEL SANSKRITIK SAMITI</text>
    </g>

    <!-- Features / Highlights Bar -->
    <g transform="translate(0, 255)">
      <!-- Line 1: Dates & Location -->
      <text x="0" y="24" fill="#FFFFFF" font-size="16" font-weight="600">
        🗓️ 15 – 20 Oct 2026  •  📍 PBEL City, Hyderabad
      </text>
      <!-- Line 2: Festival Attractions -->
      <text x="0" y="58" fill="#FDE68A" font-size="14.5" font-weight="500">
        🪔 Live Nirghanto  •  🌺 E-Seva &amp; Bhog  •  🎭 Pratibimb Stage  •  🍱 Anandamela
      </text>
    </g>

    <!-- Website URL Action Pill -->
    <g transform="translate(0, 360)">
      <rect width="460" height="54" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#dropShadow)" />
      <circle cx="34" cy="27" r="14" fill="#991B1B" />
      <text x="34" y="32" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">PSS</text>
      <text x="64" y="34" fill="#991B1B" font-size="21" font-weight="800" letter-spacing="0.5">www.pbelcitydurgotsav.com</text>
    </g>

    <text x="0" y="450" fill="#FCD34D" font-size="13" font-weight="600" opacity="0.85">
      Join Hyderabad's grand community Durga Puja celebration
    </text>
  </g>
</svg>